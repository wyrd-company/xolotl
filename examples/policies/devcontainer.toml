# xolotl policies put examples/policies/devcontainer.toml
name = "devcontainer"
description = "Coding agents in devcontainers"

# Providers this policy may use ("*" for all).
providers = ["claude", "codex", "grok", "opencode-go", "vercel"]

# Optional globs matched against `model` or `provider/model`; deny wins.
# allow_models = ["claude-*", "gpt-*", "opencode-go/*"]
deny_models = ["*-preview"]

# Who owns a model name served by several providers. Unlisted providers
# follow: claude, codex, grok, opencode-go, then gateway providers alphabetically.
precedence = ["claude", "codex", "grok", "opencode-go", "vercel"]

# Per-model overrides of precedence.
[winners]
# "kimi-k3" = "vercel"

# Extra names; a list is tried in order (fallback on 429/5xx). Use these to
# bring back a model that lost its plain name to another provider.
[aliases]
"haiku-go" = "opencode-go/claude-haiku-5-5"
"fast" = ["codex/gpt-6-codex-mini", "vercel/openai/gpt-6-mini"]
