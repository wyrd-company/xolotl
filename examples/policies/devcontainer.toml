# xolotl policies put examples/policies/devcontainer.toml
name = "devcontainer"
description = "Coding agents in devcontainers"

# Providers this policy may use ("*" for all).
providers = ["claude", "codex", "grok", "opencode-go", "vercel"]

# Model rules: globs matched against `model` or `provider/model`, in order.
# The first rule that matches decides; rules win over [models].
rules = [
  { deny = "*-preview" },
  # { allow = "claude-*" },
]

# Deny every model that no rule matches and [models] does not switch on.
# deny_other_models = true

# MCP gateway (/mcp): add "mcp" to scopes and list the servers. Tool globs
# match `tool` or `server/tool`; deny wins.
# scopes = ["proxy", "mcp"]
# mcp_servers = ["github-work"]
# deny_tools = ["*/delete_*"]

# Who owns a model name served by several providers. Unlisted providers
# follow: claude, codex, grok, opencode-go, then gateway providers alphabetically.
precedence = ["claude", "codex", "grok", "opencode-go", "vercel"]

# Rate limits on the LLM endpoints; a missing field is unlimited. Counted per
# key, or with per = "policy" shared by all keys of the policy.
# [limits]
# requests_per_minute = 60
# tokens_per_day = 5000000

# The accounts of each subscription provider that serve the keys; "*" takes
# every account, also ones added later. A provider without an entry has none.
[accounts]
claude = ["*"]
codex = ["*"]
grok = ["*"]
opencode-go = ["*"]

# Models switched on or off, for models no rule matches.
[models]
# "codex/gpt-6-codex-mini" = false

# Per-model overrides of precedence.
[winners]
# "kimi-k3" = "vercel"

# The name keys see instead of a model's plain name. The plain name goes to
# the next provider that serves it.
[renames]
# "vercel/moonshotai/kimi-k3" = "kimi-vercel"

# Extra names; a list is tried in order (fallback on 429/5xx). Use these to
# bring back a model that lost its plain name to another provider.
[aliases]
"haiku-go" = "opencode-go/claude-haiku-5-5"
"fast" = ["codex/gpt-6-codex-mini", "vercel/openai/gpt-6-mini"]
