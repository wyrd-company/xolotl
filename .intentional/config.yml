$schema: https://intentional.foo/schemas/config.yml
contract: contract-1
settings:
  internal-dependency-bump: patch
  pre-1-0-bump-mapping: component
discovery:
  managed-paths:
  - detector: cargo-package
    path: Cargo.toml
    release-unit: xolotl
release-units:
  xolotl:
    path: .
    projections:
    - adapter: cargo
      file: Cargo.toml
      mode: committed
    tags:
      primary:
        role: primary
        template: '{version}'
