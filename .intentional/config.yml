$schema: https://intentional.foo/schemas/config.yml
contract: contract-1
settings:
  internal-dependency-bump: patch
  pre-1-0-bump-mapping: component
discovery:
  managed-paths:
  - detector: cargo-package
    path: Cargo.toml
    release-unit: xolotl
release-units:
  xolotl:
    path: .
    projections:
    - adapter: cargo
      file: Cargo.toml
      mode: committed
    - adapter: yaml
      file: docs/user/docs.yml
      mode: committed
      pointer: /products/xolotl/version
    tags:
      primary:
        role: primary
        template: '{version}'
  xolotl-docs:
    path: docs/user
    depends-on:
    - xolotl
    projections:
    - adapter: yaml
      file: docs.yml
      mode: committed
      pointer: /products/xolotl/docs-version
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
