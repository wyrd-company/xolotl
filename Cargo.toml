[package]
name = "xolotl"
version = "0.1.0"
description = "LLM subscription proxy and AI gateway backed by OpenBao"
license = "Apache-2.0"
rust-version = "1.88"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
parking_lot = "0.12.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "form", "http2"] }
rpassword = "7.5.4"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "util"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
