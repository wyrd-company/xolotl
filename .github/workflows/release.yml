name: release

# Deploys only Intentional release records: annotated `X.Y.Z` tags (no `v`)
# created by `intentional tag --plan` on the applied release commit.
# Baseline records are skipped; any other tag is refused.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.verify.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch the annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: wyrd-company/intentional@0.1.6
        with:
          command: check
          intentional-version: 0.1.6
      - name: Require an Intentional release record
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          refuse() { echo "::error::refusing to deploy ${tag}: $1"; exit 1; }

          [[ "$(git cat-file -t "refs/tags/${tag}")" == "tag" ]] || refuse "not an annotated tag"
          body="$(git cat-file -p "refs/tags/${tag}" | sed '1,/^$/d')"
          [[ "$(printf '%s\n' "$body" | head -n1)" == "intentional release record" ]] || refuse "not an Intentional release record"
          field() { printf '%s\n' "$body" | sed -n "s/^$1: //p" | head -n1; }

          [[ "$(field tag-id)" == "release-unit/xolotl/primary" ]] || refuse "unexpected tag-id $(field tag-id)"
          [[ "$(field version)" == "$tag" ]] || refuse "record version $(field version) does not match the tag"
          case "$(field baseline)" in
            true)
              echo "::notice::${tag} is a baseline record; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            false) ;;
            *) refuse "record has no baseline field" ;;
          esac
          [[ -n "$(field plan-digest)" ]] || refuse "record has no plan digest"

          # The tagged commit must carry the applied release.
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [[ "$version" == "$tag" ]] || refuse "Cargo.toml version $version is not $tag (was intentional apply committed?)"
          grep -q "^## ${tag}\$" CHANGELOG.md || refuse "CHANGELOG.md has no ${tag} section"
          echo "release=true" >> "$GITHUB_OUTPUT"

  test:
    needs: guard
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  binary:
    needs: [guard, test]
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Build the web UI (embedded into the binary)
        run: pnpm build
        working-directory: ui
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=xolotl-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu
          mkdir "$name" && cp target/release/xolotl README.md CHANGELOG.md LICENSE config.example.toml "$name/"
          tar czf "$name.tar.gz" "$name" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Release notes from the changelog
        run: awk -v h="## ${GITHUB_REF_NAME}" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            xolotl-*.tar.gz
            xolotl-*.tar.gz.sha256

  image:
    needs: [guard, test]
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
