name: Publish to wyrd.foo

# Publishes docs/user and the release data to wyrd.foo when a docs unit tag
# (xolotl-docs@{version}) is pushed, and on a manual run. A plain push to main
# does not publish. The code unit tag publishes from release.yml, after the
# GitHub Release the publisher reads exists. A docs tag on the commit of a
# code release tag whose Release is not published yet does not publish: the
# docs job of release.yml publishes that commit when it has created the Release.
on:
  push:
    tags:
      - "xolotl-docs@*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
      feature:
        description: Feature a product on the front page
        type: boolean
        default: false
      feature-product:
        description: The product key to feature; empty when the repo has one product
        default: ""
      feature-days:
        description: How long the feature lasts, in days
        default: "14"
      feature-reason:
        description: For example "New MCP server"; default "New release"
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Check the docs tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # Checkout does not reliably fetch annotated tag objects.
      - name: Fetch the annotated tag objects
        run: git fetch --force --tags origin
      - id: check
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: .github/scripts/docs-tag.sh

  publish:
    needs: check
    if: >-
      ${{ !cancelled() && needs.check.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.check.outputs.publish == 'true') }}
    uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2
    with:
      ref: ${{ inputs.ref || github.ref_name }}
      feature: ${{ inputs.feature || false }}
      feature-product: ${{ inputs.feature-product || '' }}
      feature-days: ${{ inputs.feature-days || '14' }}
      feature-reason: ${{ inputs.feature-reason || '' }}
    secrets: inherit
