name: release image proof (no publish)
on:
  push:
    branches: [fix/native-release-images]
    paths: [.github/workflows/release-image-proof.yml]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,value=0.7.0,pattern={{version}}
            type=semver,value=0.7.0,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/image-${{ matrix.arch }}.tar
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Export the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: image-oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/oci
          pattern: image-oci-*
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,value=0.7.0,pattern={{version}}
            type=semver,value=0.7.0,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Verify native OCI images
        env:
          OCI_DIR: ${{ runner.temp }}/oci
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          manifests = []
          for arch in ('amd64', 'arm64'):
              with tarfile.open(Path(os.environ['OCI_DIR']) / f'image-oci-{arch}' / f'image-{arch}.tar') as tar:
                  def blob(digest):
                      data = tar.extractfile('blobs/' + digest.replace(':', '/')).read()
                      assert hashlib.sha256(data).hexdigest() == digest.split(':')[1]
                      return json.loads(data)
                  index = json.load(tar.extractfile('index.json'))
                  pending = index['manifests'][:]
                  found = []
                  while pending:
                      descriptor = pending.pop()
                      manifest = blob(descriptor['digest'])
                      if 'manifests' in manifest:
                          pending.extend(manifest['manifests'])
                      elif descriptor.get('platform', {}).get('os') != 'unknown':
                          config = blob(manifest['config']['digest'])
                          if config.get('os') == 'linux' and config.get('architecture') == arch:
                              descriptor['platform'] = {'os': 'linux', 'architecture': arch}
                              found.append(descriptor)
                  assert len(found) == 1, (arch, found)
                  manifests.extend(found)
                  print(f'PASS: native linux/{arch} OCI artifact: {found[0]["digest"]}')
          print(json.dumps({'schemaVersion': 2, 'mediaType': 'application/vnd.oci.image.index.v1+json', 'manifests': manifests}, indent=2))
          PYVERIFY
      - name: Prepare existing public digests for manifest dry-run
        working-directory: ${{ runner.temp }}/digests
        run: |
          rm -- *
          docker buildx imagetools inspect "${IMAGE}:latest" --raw | jq -r '.manifests[] | select(.platform.os == "linux") | .digest | sub("sha256:"; "")' | while IFS= read -r digest; do touch "$digest"; done
      - name: Dry-run the release manifest command (existing public layers)
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$tag"); done <<< "$TAGS"
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create --dry-run "${tags[@]}" "${sources[@]}" > "${RUNNER_TEMP}/manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "${RUNNER_TEMP}/manifest.json"
          printf '%s\n' "$TAGS"
          [[ "$(printf '%s\n' "$TAGS" | sort)" == "$(printf '%s\n' "${IMAGE}:0.7.0" "${IMAGE}:0.7" "${IMAGE}:latest" | sort)" ]]
          cat "${RUNNER_TEMP}/manifest.json"
