      <path id="nose" d="M 890,742 L 940,740 C 962,740 972,748 971,762 C 970,786 955,806 935,822 C 922,832 910,838 895,840 Z M 905,752 C 925,758 938,770 936,783 C 926,786 912,782 907,770 Z"/>
