# Xolotl example configuration. Every section is optional; defaults shown.

[server]
listen = "0.0.0.0:8317"
max_body_bytes = 67108864      # 64 MiB (OCR / batch uploads)
upstream_timeout_secs = 600    # max idle time while reading an upstream response
# public_url = "https://xolotl.example.lan"   # where browsers reach xolotl; lets OAuth logins finish by themselves

[database]
# Runtime state only (cooldowns, usage snapshots, request log). No secrets.
path = "/data/xolotl.db"
retention_days = 90

[vault]
# OpenBao / Vault. Env: BAO_ADDR, BAO_CACERT, BAO_NAMESPACE.
address = "https://bao.example.lan:8200"
mount = "secret"        # KV v2 mount
prefix = "xolotl"       # all secrets live under secret/xolotl/...
# ca_cert = "/etc/xolotl/bao-ca.pem"

[vault.approle]
mount = "approle"
# Env: XOLOTL_VAULT_ROLE_ID / XOLOTL_VAULT_SECRET_ID, or files:
role_id_file = "/run/secrets/xolotl_role_id"
secret_id_file = "/run/secrets/xolotl_secret_id"

[telemetry]
# OTLP/HTTP base; /v1/traces, /v1/metrics, /v1/logs are appended.
# OpenObserve: http://openobserve:5080/api/<org>. Env: OTEL_EXPORTER_OTLP_ENDPOINT.
# Headers can also be stored in the vault secret `xolotl/telemetry`.
otlp_endpoint = "http://openobserve:5080/api/default"
service_name = "xolotl"
log_format = "json"     # or "pretty"
log_filter = "info"
metrics_interval_secs = 30
# dashboard_url = "https://openobserve.example.lan"   # linked from the web UI's usage page

[telemetry.otlp_headers]
# Authorization = "Basic ..."   # prefer the vault secret instead

[subscription]
strategy = "round-robin"   # round-robin | fill-first | least-used
usage_poll_secs = 300
max_attempts = 3           # accounts tried per request
default_cooldown_secs = 60
refresh_margin_secs = 300
soft_limit_percent = 95.0  # accounts above this are used last
session_affinity_secs = 3600

# Gateway providers are addressed as <name>/<model> and passthrough /<name>/...
# API keys come from the vault secret providers/<name> (field api_key).
[gateway.providers.vercel]
kind = "vercel"

[gateway.providers.mistral]
kind = "mistral"

[gateway.providers.llamacpp]
kind = "openai-compatible"
base_url = "http://llama.example.lan:8080"
no_auth = true

# Model catalog: discovered from each provider, plus static entries. Client
# key policies (stored in the vault) decide which of these names a key sees.
[catalog]
refresh_secs = 600
codex_client_version = "0.160.0"   # Codex filters its model roster by client version
grok_client_version = "1.0.52"     # xAI rejects old Grok CLI versions with 426

[catalog.static_models]
# llamacpp = ["qwen3-coder"]
# Fallback if the Grok roster can't be discovered from xAI's chat proxy:
# grok = ["grok-build"]

[catalog.wires]
# Endpoint formats a provider/model is reachable on (no translation is done).
# Defaults: claude=messages, codex=responses, grok=responses, opencode-go per model,
# vercel=chat+responses+messages, others=chat.
# llamacpp = ["chat", "messages"]

# MCP gateway: upstream MCP servers (Streamable HTTP), exposed to clients at
# /mcp as one code-mode MCP server (`search` + `execute`). Keys need the `mcp`
# scope and `mcp_servers` in their policy.
[mcp]
execute_timeout_secs = 120      # wall clock per execute call, tool calls included
memory_limit_mb = 64            # QuickJS heap per execute call
max_tool_calls = 100            # per execute call
max_output_bytes = 100000
max_concurrent_executions = 8
tools_refresh_secs = 300
allowed_origins = []            # browser origins allowed to call /mcp; empty refuses any Origin

[mcp.oauth]
# OAuth logins (auth = "oauth"). The browser returns to a loopback URL whose
# address you paste back, or to xolotl itself when server.public_url is set.
# redirect_uri = "http://127.0.0.1:33418/callback"
# client_metadata_url = "https://example.com/xolotl-client.json"   # Client ID Metadata Document
client_name = "xolotl"

# One entry per instance; `{field}` in headers comes from the vault secret
# mcp/<name> (xolotl mcp set-secret <name> <field>). In code, `-` becomes `_`.
# [mcp.servers.github-work]
# url = "https://api.githubcopilot.com/mcp/"
# description = "GitHub, work account"
# headers = { Authorization = "Bearer {token}" }
# timeout_secs = 60

# An OAuth server: `xolotl mcp login linear`. Optional: oauth.client_id for a
# pre-registered client (its secret: xolotl mcp set-secret linear client_secret).
# [mcp.servers.linear]
# url = "https://mcp.linear.app/mcp"
# auth = "oauth"
